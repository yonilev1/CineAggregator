version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: cineaggregator-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cineaggregator-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  backend:
    build:
      context: ./Backend/CineAggregator.Api
    container_name: cineaggregator-backend
    ports:
      - "5000:5000"
    environment:
      MongoDb__ConnectionString: mongodb://mongodb:27017
      MongoDb__DatabaseName: CineAggregator
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
    depends_on:
      - mongodb
      - rabbitmq

  collector:
    build:
      context: ./Collector
    container_name: cineaggregator-collector
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MOVIE_API_KEY: ${MOVIE_API_KEY}
      MOVIE_API_URL: https://api.themoviedb.org/3
    depends_on:
      - rabbitmq

  frontend:
    build:
      context: ./Frontend/cineaggregator
    container_name: cineaggregator-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
